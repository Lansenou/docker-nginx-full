name: Sync with upstream
on:
  schedule:
    - cron: '0 0 * * *' # every day
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: crowdsec

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/NginxProxyManager/docker-nginx-full.git
          git fetch upstream master
          git checkout crowdsec
          git merge upstream/master --allow-unrelated-histories --no-edit || true

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: crowdsec